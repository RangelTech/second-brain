name: mac-debug
on: workflow_dispatch
jobs:
  mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar o app do release e tentar abrir
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p w && cd w
          gh release download v0.6.15 --repo RangelTech/second-brain -p 'Segundo-Cerebro-macOS-arm64.zip'
          unzip -q Segundo-Cerebro-macOS-arm64.zip
          app=$(ls -d *.app | head -1); echo "app=$app"
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          file "$bin"; codesign -dv "$app" 2>&1 | head -5 || true
          uname -m; sw_vers; launchctl managername || true
          export SB_DATA_DIR="$RUNNER_TEMP/d1"; mkdir -p "$SB_DATA_DIR"
          t() { perl -e 'alarm 10; exec @ARGV' "$@" > o.txt 2>&1; echo "rc=$? bytes=$(wc -c < o.txt)"; head -c 200 o.txt; }
          W=$PWD
          mkdir -p ../of && cd ../of && npm i --silent --no-audit --no-fund electron@33.4.11 >/dev/null 2>&1; OF=$PWD/node_modules/electron/dist/Electron.app; cd $W
          echo "=== diff dos frameworks (pacote x oficial), sem helpers"
          for f in "Electron Framework.framework" Mantle.framework ReactiveObjC.framework Squirrel.framework; do echo "-- $f"; diff -rq "$app/Contents/Frameworks/$f" "$OF/Contents/Frameworks/$f" 2>&1 | head -8; done
          echo "=== H2: pacote com Frameworks do pacote mas Mantle/ReactiveObjC/Squirrel oficiais"
          rm -rf H2.app; cp -R "$app" H2.app; for f in Mantle.framework ReactiveObjC.framework Squirrel.framework; do rm -rf "H2.app/Contents/Frameworks/$f"; cp -R "$OF/Contents/Frameworks/$f" "H2.app/Contents/Frameworks/"; done; t "H2.app/Contents/MacOS/Segundo Cérebro" --version
          echo "=== H3: pacote com helpers oficiais (Electron Helper*.app) no lugar dos renomeados"
          rm -rf H3.app; cp -R "$app" H3.app; rm -rf H3.app/Contents/Frameworks/*Helper*.app; cp -R "$OF/Contents/Frameworks/"Electron\ Helper*.app H3.app/Contents/Frameworks/; t "H3.app/Contents/MacOS/Segundo Cérebro" --version
          echo "=== helper do pacote: diff de binario vs oficial"; shasum -a 256 "$app/Contents/Frameworks/"*Helper.app/Contents/MacOS/* "$OF/Contents/Frameworks/Electron Helper.app/Contents/MacOS/Electron Helper"
          echo "=== com ELECTRON_RUN_AS_NODE (so o binario)"
          ELECTRON_RUN_AS_NODE=1 "$bin" -e "console.log('node ok', process.versions.electron)" || echo falhou
