name: mac-debug
on: workflow_dispatch
jobs:
  mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar o app do release e tentar abrir
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p w && cd w
          gh release download v0.6.15 --repo RangelTech/second-brain -p 'Segundo-Cerebro-macOS-arm64.zip'
          unzip -q Segundo-Cerebro-macOS-arm64.zip
          app=$(ls -d *.app | head -1); echo "app=$app"
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          file "$bin"; codesign -dv "$app" 2>&1 | head -5 || true
          uname -m; sw_vers; launchctl managername || true
          export SB_DATA_DIR="$RUNNER_TEMP/d1"; mkdir -p "$SB_DATA_DIR"
          t() { perl -e 'alarm 10; exec @ARGV' "$@" > o.txt 2>&1; echo "rc=$? bytes=$(wc -c < o.txt)"; head -c 200 o.txt; }
          W=$PWD
          mkdir -p ../of && cd ../of && npm i --silent --no-audit --no-fund electron@33.4.11 >/dev/null 2>&1; OF=$PWD/node_modules/electron/dist/Electron.app; cd $W
          echo "=== G: pacote com Resources oficial"
          rm -rf G.app; cp -R "$app" G.app; rm -rf G.app/Contents/Resources; cp -R "$OF/Contents/Resources" G.app/Contents/Resources; t "G.app/Contents/MacOS/Segundo Cérebro" --version
          echo "=== H: pacote com Frameworks oficial (espera erro de helper, nao queda muda)"
          rm -rf H.app; cp -R "$app" H.app; rm -rf H.app/Contents/Frameworks; cp -R "$OF/Contents/Frameworks" H.app/Contents/Frameworks; t "H.app/Contents/MacOS/Segundo Cérebro" --version
          echo "=== I: oficial com Resources do pacote + plist do pacote"
          rm -rf I.app; cp -R "$OF" I.app; cp "$app/Contents/Info.plist" I.app/Contents/Info.plist; rm -rf I.app/Contents/Resources; cp -R "$app/Contents/Resources" I.app/Contents/Resources; mv I.app/Contents/MacOS/Electron "I.app/Contents/MacOS/Segundo Cérebro"; t "I.app/Contents/MacOS/Segundo Cérebro" --version
          echo "=== J: pacote sem _CodeSignature"
          rm -rf J.app; cp -R "$app" J.app; rm -rf J.app/Contents/_CodeSignature; t "J.app/Contents/MacOS/Segundo Cérebro" --version
          echo "=== K: pacote, so o helper (Renderer) trocado pelo oficial renomeado"
          ls "$app/Contents/Frameworks"; ls "$OF/Contents/Frameworks"
          echo "=== conteudo de Contents"; ls -la "$app/Contents"
          echo "=== com ELECTRON_RUN_AS_NODE (so o binario)"
          ELECTRON_RUN_AS_NODE=1 "$bin" -e "console.log('node ok', process.versions.electron)" || echo falhou
