name: mac-debug
on: workflow_dispatch
jobs:
  mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar o app do release e tentar abrir
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p w && cd w
          gh release download v0.6.15 --repo RangelTech/second-brain -p 'Segundo-Cerebro-macOS-arm64.zip'
          unzip -q Segundo-Cerebro-macOS-arm64.zip
          app=$(ls -d *.app | head -1); echo "app=$app"
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          file "$bin"; codesign -dv "$app" 2>&1 | head -5 || true
          uname -m; sw_vers; launchctl managername || true
          export SB_DATA_DIR="$RUNNER_TEMP/d1"; mkdir -p "$SB_DATA_DIR"
          t() { perl -e 'alarm 10; exec @ARGV' "$@" > o.txt 2>&1; echo "rc=$? bytes=$(wc -c < o.txt)"; head -c 200 o.txt; }
          W=$PWD
          mkdir -p ../of && cd ../of && npm i --silent --no-audit --no-fund electron@33.4.11 >/dev/null 2>&1; OF=$PWD/node_modules/electron/dist/Electron.app; cd $W
          echo "=== L: tudo ASCII (globs sem digitar o acento)"
          rm -rf L.app; cp -R "$app" L.app
          mv L.app/Contents/MacOS/* L.app/Contents/MacOS/SegundoCerebro; /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable SegundoCerebro" L.app/Contents/Info.plist
          for h in L.app/Contents/Frameworks/*Helper*.app; do
            suf=$(basename "$h" .app); suf=${suf#*Helper}; n="L.app/Contents/Frameworks/SegundoCerebro Helper$suf.app"
            mv "$h" "$n"; e="$(ls "$n/Contents/MacOS")"; ne="SegundoCerebro Helper$suf"; mv "$n/Contents/MacOS/$e" "$n/Contents/MacOS/$ne"
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable '$ne'" "$n/Contents/Info.plist"
          done
          ls L.app/Contents/Frameworks
          t "L.app/Contents/MacOS/SegundoCerebro" --version
          echo "=== bytes do nome (normalizacao)"; ls "$app/Contents/MacOS" | xxd | head -3
          echo "=== com ELECTRON_RUN_AS_NODE (so o binario)"
          ELECTRON_RUN_AS_NODE=1 "$bin" -e "console.log('node ok', process.versions.electron)" || echo falhou
