name: mac-debug
on: workflow_dispatch
jobs:
  mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar o app do release e tentar abrir
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p w && cd w
          gh release download v0.6.15 --repo RangelTech/second-brain -p 'Segundo-Cerebro-macOS-arm64.zip'
          unzip -q Segundo-Cerebro-macOS-arm64.zip
          app=$(ls -d *.app | head -1); echo "app=$app"
          bin="$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)"
          file "$bin"; codesign -dv "$app" 2>&1 | head -5 || true
          uname -m; sw_vers; launchctl managername || true
          export SB_DATA_DIR="$RUNNER_TEMP/d1"; mkdir -p "$SB_DATA_DIR"
          t() { perl -e 'alarm 10; exec @ARGV' "$@" > o.txt 2>&1; echo "rc=$? bytes=$(wc -c < o.txt)"; head -c 300 o.txt; }
          echo "=== --version do app publicado"; t "$bin" --version
          echo "=== copia com nome ASCII"
          cp -R "$app" "ASCII.app"; mv "ASCII.app/Contents/MacOS/Segundo Cérebro" "ASCII.app/Contents/MacOS/Segundo"; /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Segundo" ASCII.app/Contents/Info.plist
          t "ASCII.app/Contents/MacOS/Segundo" --version
          echo "=== Electron oficial renomeado para o nome com acento"
          mkdir -p ../oficial && cd ../oficial && npm i --silent --no-audit --no-fund electron@33.4.11 >/dev/null 2>&1
          cp -R node_modules/electron/dist/Electron.app "Segundo Cérebro.app"; mv "Segundo Cérebro.app/Contents/MacOS/Electron" "Segundo Cérebro.app/Contents/MacOS/Segundo Cérebro"; /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable 'Segundo Cérebro'" "Segundo Cérebro.app/Contents/Info.plist"
          t "Segundo Cérebro.app/Contents/MacOS/Segundo Cérebro" --version
          echo "=== Electron oficial, nome original"
          t node_modules/electron/dist/Electron.app/Contents/MacOS/Electron --version
          cd ../w
          echo "=== com ELECTRON_RUN_AS_NODE (so o binario)"
          ELECTRON_RUN_AS_NODE=1 "$bin" -e "console.log('node ok', process.versions.electron)" || echo falhou
