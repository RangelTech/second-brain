name: _site
# CI do site (pasta site/): testes, extensão baixada da release, imagem nginx de pé e saudável.
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test site/test/assinar.test.js
      - run: bash site/scripts/baixar-extensao.sh
      - name: Imagem e saúde
        run: |
          docker build -t brain-site:ci site
          cid=$(docker run -d --rm -p 18080:8080 brain-site:ci)
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/ | grep -q "Cérebro Pro"
          curl -fsS -o /dev/null http://127.0.0.1:18080/extensao/segundo-cerebro-chrome.zip
          curl -fsS http://127.0.0.1:18080/extensao/versao.json
          docker stop "$cid" >/dev/null
