name: release-site
# Publica a imagem do site + release-manifest.site.json com tag própria site-v* (spec 57 §3.3.3). NÃO faz deploy (só o
# vps_rt_infra implanta: deploy.yml -f service=brain-site). Nunca vira "latest" (a latest é do app, tag v*).
on:
  push:
    tags: ['site-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'tag completa (ex.: site-v0.1.27)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versão
        id: v
        run: |
          V="${{ inputs.version }}"; [ -n "$V" ] || V="${GITHUB_REF_NAME}"
          case "$V" in site-v*) ;; *) echo "tag precisa começar com site-v"; exit 1;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: node --test site/test/assinar.test.js
      - run: bash site/scripts/baixar-extensao.sh
      - name: Build da imagem e teste de saúde
        run: |
          V="${{ steps.v.outputs.version }}"
          docker build -t "brain-site:${V}" site
          cid=$(docker run -d --rm -p 18080:8080 "brain-site:${V}")
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health && curl -fsS http://127.0.0.1:18080/ | grep -q "Cérebro Pro"
          curl -fsS -o /dev/null http://127.0.0.1:18080/extensao/segundo-cerebro-chrome.zip
          docker stop "$cid" >/dev/null
          docker save "brain-site:${V}" | gzip -9 > image.tar.gz
          echo "IMAGE_ID=sha256:$(gunzip -c image.tar.gz | tar -xO manifest.json | python3 -c "import sys,json,re;print(re.sub(r'^.*/','',json.load(sys.stdin)[0]['Config']).replace('.json',''))")" >> "$GITHUB_ENV"
          echo "ARCHIVE_SHA=$(sha256sum image.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Manifesto
        run: |
          python3 - <<'PY'
          import json, os, datetime
          v = "${{ steps.v.outputs.version }}"
          m = {"schema": 1, "service": "brain-site", "repo": "RangelTech/second-brain", "commit": os.environ["GITHUB_SHA"][:7], "version": v,
               "artifact": {"type": "docker-archive", "asset": "image.tar.gz", "sha256": os.environ["ARCHIVE_SHA"], "image_id": os.environ["IMAGE_ID"], "tag": "brain-site:" + v},
               "built_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
               "healthcheck": {"path": "/health", "expect": 200, "timeout_s": 60, "port": 8080},
               "env": {"required": []}, "resources": {"memory": "64m", "cpus": "0.25"}}
          json.dump(m, open("release-manifest.site.json", "w"), indent=2)
          PY
      - name: GitHub Release (sem virar latest)
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "$V" release-manifest.site.json image.tar.gz --title "Site $V" --notes "Site do Cérebro Pro. Artefato docker-archive. Deploy: somente vps_rt_infra." --target "${GITHUB_SHA}" --latest=false \
            || gh release upload "$V" release-manifest.site.json image.tar.gz --clobber
      - name: A latest continua sendo o app (tag v*)
        run: |
          L=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          echo "latest: $L"
          if ! echo "$L" | grep -Eq '^v[0-9]'; then
            A=$(gh release list --limit 50 --json tagName,isDraft,isPrerelease -q '[.[] | select((.tagName|test("^v[0-9]")) and (.isDraft|not) and (.isPrerelease|not))][0].tagName')
            gh release edit "$A" --latest
            echo "::error::a latest tinha virado $L; devolvida para $A"; exit 1
          fi
