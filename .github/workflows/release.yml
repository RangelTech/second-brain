name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: dist:ci:nsis
            podar: darwin linux
          - os: ubuntu-latest
            alvo: dist:linux
            podar: darwin win32
          - os: macos-latest
            alvo: dist:mac
            podar: win32 linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: for i in 1 2 3 4; do npm ci && exit 0; echo "npm ci falhou (tentativa $i), esperando"; rm -rf node_modules; sleep $((i*20)); done; exit 1
        shell: bash
      - run: node scripts/checar-pacote.js
      - run: node --test test/atualizador.test.js
      - run: npm run router:build
      - run: npm run modelo:voz
      # tira do pacote os binários do Whisper (onnxruntime) de outros sistemas: deixa o instalador menor
      - name: Podar binários de outros sistemas
        shell: bash
        run: for d in ${{ matrix.podar }}; do rm -rf node_modules/onnxruntime-node/bin/napi-v6/$d; done
      # Windows: o instalador leva o agente (Hermes) dentro, compactado, para a instalacao nao depender de baixar nada no PC do cliente.
      # O portatil sai ANTES (sem o agente: ele descompacta a cada abertura e ficaria enorme); depois o agente e montado e entra so no instalador.
      - name: Empacotar o portatil (Windows, sem o agente embutido)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for i in 1 2 3; do npm run dist:ci:portatil && exit 0; echo "portatil falhou (tentativa $i de 3)"; sleep 15; done; exit 1
      - name: Montar o agente embutido (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 75
        run: ./scripts/montar-hermes-embutido.ps1
      # Assinatura do Windows: desligada até existir certificado (segredos WIN_CSC_LINK e WIN_CSC_KEY_PASSWORD).
      # hdiutil do macOS falha de vez em quando (disco ocupado ao montar a imagem): repete o empacotamento até 3 vezes.
      - name: Empacotar
        shell: bash
        # Windows: assina o instalador e o programa com o certificado da Rangel Tech (segredos do repositório; Mac e Linux ignoram)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for i in 1 2 3; do
            npm run ${{ matrix.alvo }} && exit 0
            echo "empacotamento falhou (tentativa $i de 3)"
            [ "$RUNNER_OS" = "macOS" ] && { hdiutil info | grep -i "image-path" | head -5; sudo pkill -f diskimages-helper || true; }
            rm -rf dist/mac dist/mac-arm64 dist/*.dmg dist/*.blockmap 2>/dev/null || true
            sleep 15
          done
          exit 1
      # o teste de instalacao tem de descompactar o agente DE VERDADE: tira a pasta fixa usada na montagem
      - name: Limpar a montagem do agente (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force 'C:\SegundoCerebro' -ErrorAction SilentlyContinue
      - name: Conferir a assinatura (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist/Segundo-Cerebro-Windows*.exe) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} | {2}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject
            if (-not $s.SignerCertificate) { throw "sem assinatura: $($f.Name)" }
          }
      # Teste de instalação em cada sistema: instala o pacote que acabou de ser gerado e manda uma conversa de verdade ao agente.
      # Se não responder, o release não é publicado. Dados em pasta isolada (SB_DATA_DIR).
      - name: Testar instalação (conversa com o agente)
        shell: bash
        timeout-minutes: 30
        env:
          SB_DATA_DIR: ${{ runner.temp }}/sb-dados
        run: |
          mkdir -p "$SB_DATA_DIR"
          case "$RUNNER_OS" in
            Windows)
              # o powershell do runner do Windows trava (segfault 139) de vez em quando, antes de rodar o instalador: tenta de novo até 3 vezes
              for tentativa in 1 2 3; do
                powershell -NoProfile -Command "\$p = Start-Process -FilePath 'dist/Segundo-Cerebro-Windows.exe' -ArgumentList '/S' -Wait -PassThru; exit \$p.ExitCode" && break
                echo "instalador: tentativa $tentativa falhou, repetindo"; sleep 5
              done
              # o instalador nao prepara mais o agente (o app faz isso ao abrir): o teste roda o preparo + a conversa de verdade aqui, e mede o tempo
              inicio=$(date +%s)
              powershell -NoProfile -Command "\$e = Join-Path \$env:LOCALAPPDATA 'Programs\second-brain\Segundo Cérebro.exe'; \$p = Start-Process -FilePath \$e -ArgumentList '--preparar-agente' -Wait -PassThru; exit \$p.ExitCode" || true
              echo "preparo do agente no cliente: $(( $(date +%s) - inicio )) s" ;;
            Linux)
              sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgbm1 libasound2t64 || true
              chmod +x dist/Segundo-Cerebro-Linux.AppImage
              (cd dist && ./Segundo-Cerebro-Linux.AppImage --appimage-extract >/dev/null)
              xvfb-run -a "$PWD/dist/squashfs-root/second-brain" --no-sandbox --preparar-agente ;;
            macOS)
              app=$(ls -d dist/mac-arm64/*.app 2>/dev/null | head -1)
              [ -n "$app" ] || app=$(ls -d dist/mac*/*.app | head -1)
              ls "$app/Contents/MacOS"
              export ELECTRON_ENABLE_LOGGING=1
              # MAC ZERADO (11/11/2026): o executor do GitHub tem as ferramentas da Apple e o git do Homebrew; um Mac de cliente nao tem.
              # Sem o Homebrew no PATH e com as ferramentas apontando para o nada, o /usr/bin/git e o cc viram o atalho que falha, como num Mac novo.
              env PATH=/usr/bin:/bin:/usr/sbin:/sbin DEVELOPER_DIR=/sb-sem-ferramentas SB_SEM_FERRAMENTAS_SISTEMA=1 \
                "$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)" --preparar-agente 2>&1 | tail -60 || true
              echo "--- hermes-instalacao.log (final)"; tail -40 "$SB_DATA_DIR/hermes-instalacao.log" 2>/dev/null | cut -c1-240 || true
              ls ~/Library/Logs/DiagnosticReports 2>/dev/null | head -3
              for r in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1); do head -c 4000 "$r"; done ;;
          esac
          test -f "$SB_DATA_DIR/teste-instalacao.ok"
      - name: Registro do teste de instalação
        if: always()
        shell: bash
        env:
          SB_DATA_DIR: ${{ runner.temp }}/sb-dados
        run: |
          cat "$SB_DATA_DIR/preparo.log" 2>/dev/null || echo "sem preparo.log"
          echo "--- agente.log (final)"; tail -n 60 "$SB_DATA_DIR/logs/agente.log" 2>/dev/null | cut -c1-240 || true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # nasce como pré-lançamento: só vira "a mais recente" (site, atualizador das VMs e do app) no job `promover`, depois dos 3 sistemas
          prerelease: true
          files: |
            dist/Segundo-Cerebro-Windows.exe
            dist/Segundo-Cerebro-Windows-Portatil.exe
            dist/Segundo-Cerebro-Linux.AppImage
            dist/Segundo-Cerebro-Linux.deb
            dist/Segundo-Cerebro-macOS-*.dmg
            dist/Segundo-Cerebro-macOS-*.zip
            dist/latest*.yml

  # Só com Windows, macOS e Linux publicados a versão passa a ser "a mais recente". Se um sistema falhar, a release fica como pré-lançamento
  # e ninguém recebe link quebrado (11/11/2026: a 0.6.59 virou "latest" sem o instalador do Windows e o download do site deu 404).
  promover:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
