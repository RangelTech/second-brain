name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: dist:ci
            podar: darwin linux
          - os: ubuntu-latest
            alvo: dist:linux
            podar: darwin win32
          - os: macos-latest
            alvo: dist:mac
            podar: win32 linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/checar-pacote.js
      - run: node --test test/atualizador.test.js
      - run: npm run router:build
      - run: npm run modelo:voz
      # tira do pacote os binários do Whisper (onnxruntime) de outros sistemas: deixa o instalador menor
      - name: Podar binários de outros sistemas
        shell: bash
        run: for d in ${{ matrix.podar }}; do rm -rf node_modules/onnxruntime-node/bin/napi-v6/$d; done
      # Assinatura do Windows: desligada até existir certificado (segredos WIN_CSC_LINK e WIN_CSC_KEY_PASSWORD).
      # hdiutil do macOS falha de vez em quando (disco ocupado ao montar a imagem): repete o empacotamento até 3 vezes.
      - name: Empacotar
        shell: bash
        run: |
          for i in 1 2 3; do
            npm run ${{ matrix.alvo }} && exit 0
            echo "empacotamento falhou (tentativa $i de 3)"
            [ "$RUNNER_OS" = "macOS" ] && { hdiutil info | grep -i "image-path" | head -5; sudo pkill -f diskimages-helper || true; }
            rm -rf dist/mac dist/mac-arm64 dist/*.dmg dist/*.blockmap 2>/dev/null || true
            sleep 15
          done
          exit 1
      # Teste de instalação em cada sistema: instala o pacote que acabou de ser gerado e manda uma conversa de verdade ao agente.
      # Se não responder, o release não é publicado. Dados em pasta isolada (SB_DATA_DIR).
      - name: Testar instalação (conversa com o agente)
        shell: bash
        timeout-minutes: 30
        env:
          SB_DATA_DIR: ${{ runner.temp }}/sb-dados
        run: |
          mkdir -p "$SB_DATA_DIR"
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -Command "\$p = Start-Process -FilePath 'dist/Segundo-Cerebro-Windows.exe' -ArgumentList '/S' -Wait -PassThru; exit \$p.ExitCode" ;;
            Linux)
              sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgbm1 libasound2t64 || true
              chmod +x dist/Segundo-Cerebro-Linux.AppImage
              (cd dist && ./Segundo-Cerebro-Linux.AppImage --appimage-extract >/dev/null)
              xvfb-run -a "$PWD/dist/squashfs-root/AppRun" --no-sandbox --preparar-agente ;;
            macOS)
              app=$(ls -d dist/mac-arm64/*.app 2>/dev/null | head -1)
              [ -n "$app" ] || app=$(ls -d dist/mac*/*.app | head -1)
              ls "$app/Contents/MacOS"
              "$app/Contents/MacOS/$(ls "$app/Contents/MacOS" | head -1)" --preparar-agente ;;
          esac
          test -f "$SB_DATA_DIR/teste-instalacao.ok"
      - name: Registro do teste de instalação
        if: always()
        shell: bash
        env:
          SB_DATA_DIR: ${{ runner.temp }}/sb-dados
        run: cat "$SB_DATA_DIR/preparo.log" 2>/dev/null || echo "sem preparo.log"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Segundo-Cerebro-Windows.exe
            dist/Segundo-Cerebro-Windows-Portatil.exe
            dist/Segundo-Cerebro-Linux.AppImage
            dist/Segundo-Cerebro-Linux.deb
            dist/Segundo-Cerebro-macOS-*.dmg
            dist/Segundo-Cerebro-macOS-*.zip
            dist/latest*.yml
