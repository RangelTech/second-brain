name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: dist:ci
            podar: darwin linux
          - os: ubuntu-latest
            alvo: dist:linux
            podar: darwin win32
          - os: macos-latest
            alvo: dist:mac
            podar: win32 linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/checar-pacote.js
      - run: npm run router:build
      - run: npm run modelo:voz
      # tira do pacote os binários do Whisper (onnxruntime) de outros sistemas: deixa o instalador menor
      - name: Podar binários de outros sistemas
        shell: bash
        run: for d in ${{ matrix.podar }}; do rm -rf node_modules/onnxruntime-node/bin/napi-v6/$d; done
      # Assinatura do Windows: desligada até existir certificado (segredos WIN_CSC_LINK e WIN_CSC_KEY_PASSWORD).
      - run: npm run ${{ matrix.alvo }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Segundo-Cerebro-Windows.exe
            dist/Segundo-Cerebro-Windows-Portatil.exe
            dist/Segundo-Cerebro-Linux.AppImage
            dist/Segundo-Cerebro-Linux.deb
            dist/Segundo-Cerebro-macOS-*.dmg
            dist/Segundo-Cerebro-macOS-*.zip
            dist/latest*.yml
