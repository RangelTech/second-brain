name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: dist:ci
          - os: ubuntu-latest
            alvo: dist:linux
          - os: macos-latest
            alvo: dist:mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run router:build
      - run: npm run modelo:voz
      # Assinatura do Windows: desligada até existir certificado (segredos WIN_CSC_LINK e WIN_CSC_KEY_PASSWORD).
      - run: npm run ${{ matrix.alvo }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Segundo-Cerebro-Windows.exe
            dist/Segundo-Cerebro-Windows-Portatil.exe
            dist/Segundo-Cerebro-Linux.AppImage
            dist/Segundo-Cerebro-Linux.deb
            dist/Segundo-Cerebro-macOS-*.dmg
            dist/Segundo-Cerebro-macOS-*.zip
            dist/latest*.yml
