<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Segundo Cérebro</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;width:300px;font:14px/1.45 system-ui,Segoe UI,sans-serif;background:Canvas;color:CanvasText}
  header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(127,127,127,.3)}
  header img{width:28px;height:28px;border-radius:7px}
  h1{font-size:15px;margin:0}
  main{padding:14px 16px}
  .estado{display:flex;align-items:center;gap:8px;margin:0 0 12px}
  .ponto{width:10px;height:10px;border-radius:50%;background:#b45309;flex:none}
  .ponto.ok{background:#16a34a}.ponto.pausa{background:#6b7280}.ponto.age{background:#2563eb}
  p{margin:0 0 12px;color:GrayText;font-size:13px}
  button{width:100%;height:38px;border-radius:10px;border:1px solid rgba(127,127,127,.45);background:transparent;color:inherit;font:inherit;cursor:pointer;margin:0 0 8px}
  button.pri{background:#2563eb;border-color:#2563eb;color:#fff}
  .peq{font-size:12px;color:GrayText;text-align:center;margin-top:6px}
</style>
</head>
<body>
<header><img src="icons/48.png" alt=""><h1>Segundo Cérebro</h1></header>
<main>
  <div class="estado"><span class="ponto" id="ponto"></span><b id="titulo">Verificando…</b></div>
  <p id="texto"></p>
  <button class="pri" id="entrar" hidden>Entrar</button>
  <button id="pausar" hidden>Pausar</button>
  <button id="desconectar" hidden>Desconectar este Chrome</button>
  <div class="peq" id="versao"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
