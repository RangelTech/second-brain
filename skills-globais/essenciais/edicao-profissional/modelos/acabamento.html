<!doctype html><html><head><meta charset="utf-8">
<!-- Acabamento leve por cima de um vídeo pronto (skill edicao-profissional, comando acabamento): moldura fina, @ do perfil e chamada final. -->
<style>
  :root{--d:#ffffff;--acento:#22d3a6}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  #raiz{position:absolute;inset:0}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .moldura{position:absolute;border:calc(3px * var(--s)) solid color-mix(in srgb,var(--d) 85%,transparent);border-radius:calc(30px * var(--s));box-shadow:0 0 0 calc(2px * var(--s)) rgba(0,0,0,.25) inset}
  .perfil{position:absolute;display:flex;align-items:center;gap:.45em;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);padding:.32em .8em .32em .38em;border-radius:999px;font-weight:700;white-space:nowrap}
  .perfil i{width:1.25em;height:1.25em;border-radius:50%;background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.8em;font-weight:900}
  .cta{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:.3em;text-align:center}
  .cta small{font-weight:700;background:rgba(0,0,0,.5);padding:.25em .7em;border-radius:.4em}
  .cta b{display:flex;align-items:center;gap:.4em;background:#fff;color:#111;font-weight:900;padding:.4em .9em;border-radius:.5em;box-shadow:0 .3em 1em rgba(0,0,0,.5)}
  .cta b em{font-style:normal;color:#fff;background:var(--acento);padding:0 .3em;border-radius:.2em}
</style></head><body><div id="raiz"></div>
<script>
window.D = /*DADOS*/{"W":1080,"H":1920,"dur":10,"video":"video.mp4","arroba":"@perfil","cta":"Se quiser saber mais|digita *IA* nos comentários","ctaSeg":4.5,"cor":"#22d3a6"}/*FIM*/
const { prog, spring } = SB
const D = window.D, W = D.W, H = D.H, S = Math.min(W, H) / 1080, VERT = H > W
document.documentElement.style.setProperty('--s', S)
document.documentElement.style.setProperty('--acento', D.cor || '#22d3a6')
const px = (n) => n * S + 'px'
function Cta({ t }) {
  if (!D.cta) return null
  const ini = Math.max(0, D.dur - (D.ctaSeg || 4.5))
  if (t < ini - 0.05) return null
  const [linha1, linha2] = String(D.cta).split('|')
  const k = spring(t, ini + 0.15, { freq: 1.8, damp: 5.5 })
  const pulso = 1 + 0.03 * Math.sin(Math.max(0, t - ini - 1) * 6)
  const partes = String(linha2 || linha1).split(/(\*[^*]+\*)/).filter(Boolean)
  return html`<div class="cta" style=${{ top: H * (VERT ? 0.69 : 0.6) + 'px', fontSize: px(VERT ? 58 : 50) }}>
    ${linha2 ? html`<small style=${{ opacity: prog(t, ini, 0.4), fontSize: '.62em' }}>${linha1}</small>` : null}
    <b style=${{ transform: `scale(${Math.max(0, k) * pulso})` }}>
      <svg width="1em" height="1em" viewBox="0 0 24 24"><path fill="#111" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
      ${partes.map((p, i) => (p.startsWith('*') ? html`<em key=${i}>${p.slice(1, -1)}</em>` : p))}
    </b></div>`
}
function Acabamento({ t }) {
  const m = prog(t, 0, 0.6, 'outExpo')
  const ins = 22 * S
  const pf = spring(t, 0.4, { freq: 1.6, damp: 7 })
  return html`<div style=${{ position: 'absolute', inset: 0 }}>
    <video src=${D.video} data-inicio="0"></video>
    <div class="moldura" style=${{ left: ins + 'px', top: ins + 'px', right: ins + 'px', bottom: ins + 'px', opacity: m }}></div>
    ${D.arroba ? html`<div class="perfil" style=${{ left: 48 * S + 'px', top: H * (D.arrobaY ?? (VERT ? 0.04 : 0.05)) + 'px', fontSize: px(36), opacity: Math.min(1, pf * 1.5), transform: `translateX(${(1 - Math.min(1, pf)) * -40}px)` }}><i>@</i>${String(D.arroba).replace(/^@/, '')}</div>` : null}
    <${Cta} t=${t} />
  </div>`
}
const root = ReactDOM.createRoot(document.getElementById('raiz'))
window.sbFrame = (t) => { try { ReactDOM.flushSync(() => root.render(html`<${Acabamento} t=${t} />`)) } catch (e) { document.body.insertAdjacentHTML('beforeend', `<pre style="position:absolute;left:20px;top:20px;right:20px;z-index:99;color:#ff4d4d;background:#000c;font:28px monospace;white-space:pre-wrap">ERRO t=${t.toFixed(2)}: ${String(e && e.stack || e).slice(0, 600)}</pre>`) } }
</script></body></html>
