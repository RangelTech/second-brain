<!doctype html><html><head><meta charset="utf-8">
<!-- Modelo do reel narrado (skill reel-narrado). NÃO edite a linha do TL à mão: o montar_reel.py preenche com o roteiro e os tempos medidos da fala. -->
<style>
  :root{--fundo:#0b0d14;--d1:#7c5cff;--d2:#22d3a6;--texto:#f4f2ff}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--fundo);font-family:"Segoe UI",system-ui,sans-serif;color:var(--texto)}
  #raiz{position:absolute;inset:0}
  .fundo{position:absolute;inset:-240px;background:radial-gradient(900px 900px at var(--x) var(--y),color-mix(in srgb,var(--d1) 55%,transparent),transparent 62%),radial-gradient(780px 780px at var(--x2) var(--y2),color-mix(in srgb,var(--d2) 35%,transparent),transparent 60%),var(--fundo)}
  .grade{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(circle at 50% 42%,#000 25%,transparent 72%)}
  .p{position:absolute;border-radius:50%;background:var(--d2)}
  .topo{position:absolute;top:170px;left:80px;right:80px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
  .topo i{position:absolute;inset:0;background:linear-gradient(90deg,var(--d1),var(--d2));transform-origin:left}
  .marca{position:absolute;top:210px;left:80px;font-size:32px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
  .cena{position:absolute;left:80px;right:80px;top:330px;bottom:520px;display:flex;flex-direction:column;justify-content:center}
  .selo{align-self:flex-start;padding:12px 28px;border-radius:999px;border:2px solid var(--d2);color:var(--d2);font-size:34px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:40px;white-space:nowrap}
  .titulo{font-size:118px;font-weight:800;line-height:1.03;letter-spacing:-.02em}
  .titulo span{display:inline-block;margin-right:.24em}
  .destaque{background:linear-gradient(90deg,var(--d1),var(--d2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .texto{margin-top:44px;font-size:52px;line-height:1.3;color:color-mix(in srgb,var(--texto) 82%,transparent)}
  .num{font-size:300px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--d1),var(--d2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .rotulo{font-size:60px;font-weight:700;margin-top:20px}
  .indice{font-size:200px;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:3px var(--d2);margin-bottom:10px}
  .lista{margin-top:40px;display:flex;flex-direction:column;gap:22px}
  .lista div{font-size:50px;font-weight:600;display:flex;gap:22px;align-items:center}
  .lista b{width:22px;height:22px;border-radius:50%;background:var(--d2);flex:none}
  .cta{align-self:flex-start;margin-top:60px;padding:34px 64px;border-radius:28px;background:linear-gradient(90deg,var(--d1),var(--d2));color:#0b0d14;font-size:58px;font-weight:800;white-space:nowrap;box-shadow:0 30px 90px color-mix(in srgb,var(--d1) 50%,transparent)}
  /* biblioteca de cenas: telas de app, gráfico, comentários, chat (estilo "interface escura em cartões") */
  .janela{background:#11131c;border:1px solid rgba(255,255,255,.1);border-radius:28px;box-shadow:0 40px 120px rgba(0,0,0,.6);overflow:hidden;margin-top:40px}
  .janela .barra-j{display:flex;gap:12px;align-items:center;padding:20px 26px;border-bottom:1px solid rgba(255,255,255,.08);font-size:26px;color:#9aa0b4}
  .janela .barra-j i{width:16px;height:16px;border-radius:50%;background:#ff5f57}.janela .barra-j i:nth-child(2){background:#febc2e}.janela .barra-j i:nth-child(3){background:#28c840}
  .janela .corpo-j{padding:34px 36px;font-size:40px;line-height:1.45;min-height:260px}
  .cursor{display:inline-block;width:.5em;height:1em;background:var(--d2);vertical-align:-.12em;margin-left:4px}
  .barras{display:flex;align-items:flex-end;gap:22px;height:520px;margin-top:40px;padding:0 10px;border-bottom:3px solid rgba(255,255,255,.15)}
  .barras div{flex:1;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,var(--d2),var(--d1));position:relative}
  .barras div b{position:absolute;left:0;right:0;top:-58px;text-align:center;font-size:38px}
  .barras div span{position:absolute;left:0;right:0;bottom:-56px;text-align:center;font-size:30px;color:#9aa0b4}
  .comentarios{display:flex;flex-direction:column;gap:22px;margin-top:40px}
  .comentarios div{display:flex;gap:20px;align-items:center;background:#11131c;border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:22px 26px;font-size:38px}
  .comentarios div i{width:64px;height:64px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--d1),var(--d2))}
  .comentarios div b{display:block;font-size:28px;color:#9aa0b4;font-weight:600}
  .chat{display:flex;flex-direction:column;gap:20px;margin-top:40px}
  .chat div{max-width:78%;padding:22px 28px;border-radius:30px;font-size:40px;line-height:1.3}
  .chat .eles{align-self:flex-start;background:#1c1f2b;border-bottom-left-radius:8px}
  .chat .eu{align-self:flex-end;background:linear-gradient(135deg,var(--d1),var(--d2));color:#0b0d14;font-weight:600;border-bottom-right-radius:8px}
  /* legenda estilo "seleção": a palavra falada fica dentro de uma caixa azul, em itálico */
  .leg.selecao span.agora{color:#fff;font-style:italic;font-family:Georgia,"Times New Roman",serif;font-weight:700;outline:4px solid #4f8cff;outline-offset:6px;background:rgba(79,140,255,.18)}
  .leg{position:absolute;left:70px;right:70px;bottom:300px;min-height:150px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:0 16px;font-size:54px;font-weight:800;line-height:1.25;text-align:center;text-shadow:0 4px 18px rgba(0,0,0,.6)}
  .leg span{opacity:.35}
  .leg span.dita{opacity:1}
  .leg span.agora{color:var(--d2)}
</style></head><body><div id="raiz"></div>
<script>
window.TL = /*TL*/{"total":6,"marca":"","cores":{},"cenas":[{"tipo":"gancho","ini":0,"fim":5.5,"titulo":"Exemplo de *reel*","texto":"","fala":"Exemplo de reel narrado.","palavras":[]}]}/*FIM*/
const { prog, spring, mix, noise, stagger } = SB
const TL = window.TL
for (const [k, v] of Object.entries(TL.cores || {})) document.documentElement.style.setProperty('--' + k, v)
const P = Array.from({ length: 34 }, (_, i) => ({ x: (i * 137) % 1080, y: (i * 251) % 1920, v: 25 + (i % 7) * 12, r: 4 + (i % 5) * 3 }))

// "*palavra*" no título = destaque com gradiente
const pedacos = (s) => String(s || '').split(' ').filter(Boolean).map((w) => ({ w: w.replace(/\*/g, ''), d: /^\*|\*$/.test(w) }))
function Titulo({ t, txt, ini }) {
  return html`<div class="titulo">${pedacos(txt).map((p, i) => {
    const k = spring(t, stagger(i, ini + 0.1, 0.11), { freq: 1.9, damp: 7 })
    return html`<span key=${i} class=${p.d ? 'destaque' : ''} style=${{ opacity: Math.min(1, k * 1.4), transform: `translateY(${(1 - k) * 110}px) rotate(${(1 - k) * 6}deg)` }}>${p.w}</span>`
  })}</div>`
}
function Texto({ t, txt, ini }) {
  if (!txt) return null
  const a = prog(t, ini, 0.6)
  return html`<div class="texto" style=${{ opacity: a, transform: `translateY(${(1 - a) * 40}px)` }}>${txt}</div>`
}
function Cena({ c, t, n, total }) {
  const ini = c.ini
  const sai = prog(t, c.fim - 0.35, 0.35, 'in') // sai junto com o fim da fala
  const ent = prog(t, ini, 0.45, 'outExpo')
  const estilo = { opacity: ent * (1 - sai), transform: `translateY(${(1 - ent) * 60 - sai * 50}px)` }
  let corpo
  if (c.tipo === 'numero') {
    const alvo = parseFloat(String(c.numero).replace(',', '.')) || 0
    const casas = String(c.numero).includes(',') || String(c.numero).includes('.') ? 1 : 0
    const v = mix(0, alvo, prog(t, ini + 0.2, Math.min(1.6, (c.fim - ini) * 0.5), 'outExpo'))
    const suf = String(c.numero).replace(/^[\d.,]+/, '')
    corpo = html`<div class="num">${v.toFixed(casas).replace('.', ',')}${suf}</div><div class="rotulo">${c.rotulo || ''}</div><${Texto} t=${t} txt=${c.texto} ini=${ini + 0.8} />`
  } else if (c.tipo === 'dica') {
    const k = spring(t, ini + 0.05)
    corpo = html`<div class="indice" style=${{ transform: `scale(${0.6 + 0.4 * Math.min(1.2, k)})`, transformOrigin: 'left center' }}>${String(c.indice || n).padStart(2, '0')}</div><${Titulo} t=${t} txt=${c.titulo} ini=${ini + 0.2} /><${Texto} t=${t} txt=${c.texto} ini=${ini + 0.7} />`
  } else if (c.tipo === 'lista') {
    corpo = html`<${Titulo} t=${t} txt=${c.titulo} ini=${ini} /><div class="lista">${(c.itens || []).map((it, i) => {
      const a = prog(t, ini + 0.6 + i * ((c.fim - ini - 1) / Math.max(1, (c.itens || []).length)), 0.45, 'outExpo')
      return html`<div key=${i} style=${{ opacity: a, transform: `translateX(${(1 - a) * -60}px)` }}><b></b>${it}</div>`
    })}</div>`
  } else if (c.tipo === 'interface') {
    // janela de app com texto sendo digitado no ritmo da fala
    const txt = String(c.texto || '')
    const p = prog(t, ini + 0.3, Math.max(0.8, (c.fim - ini) * 0.7), 'linear')
    const vis = txt.slice(0, Math.round(txt.length * p))
    corpo = html`<${Titulo} t=${t} txt=${c.titulo} ini=${ini} /><div class="janela" style=${{ opacity: prog(t, ini + 0.15, 0.4), transform: `translateY(${(1 - prog(t, ini + 0.15, 0.5, 'outExpo')) * 60}px)` }}><div class="barra-j"><i></i><i></i><i></i><span style=${{ marginLeft: '14px' }}>${c.app || 'Cérebro Pro'}</span></div><div class="corpo-j">${vis}<span class="cursor" style=${{ opacity: Math.floor(t * 2) % 2 ? 1 : 0.2 }}></span></div></div>`
  } else if (c.tipo === 'grafico') {
    // barras que sobem uma a uma; valores e rótulos
    const itens = c.itens || []
    const max = Math.max(1, ...itens.map((x) => +x.valor || 0))
    corpo = html`<${Titulo} t=${t} txt=${c.titulo} ini=${ini} /><div class="barras">${itens.map((x, i) => {
      const k = prog(t, ini + 0.4 + i * 0.18, 0.8, 'outExpo')
      return html`<div key=${i} style=${{ height: (k * (+x.valor || 0) / max) * 100 + '%' }}><b style=${{ opacity: k }}>${x.mostrar || x.valor}</b><span>${x.rotulo || ''}</span></div>`
    })}</div>`
  } else if (c.tipo === 'comentarios') {
    const itens = c.itens || []
    corpo = html`<${Titulo} t=${t} txt=${c.titulo} ini=${ini} /><div class="comentarios">${itens.map((x, i) => {
      const k = spring(t, ini + 0.5 + i * Math.min(0.9, ((c.fim - ini) - 1) / Math.max(1, itens.length)), { freq: 2, damp: 7 })
      return html`<div key=${i} style=${{ opacity: Math.min(1, k * 1.5), transform: `translateX(${(1 - Math.min(1, k)) * 80}px)` }}><i></i><span><b>${x.nome || '@pessoa'}</b>${x.texto}</span></div>`
    })}</div>`
  } else if (c.tipo === 'chat') {
    const itens = c.itens || []
    corpo = html`<${Titulo} t=${t} txt=${c.titulo} ini=${ini} /><div class="chat">${itens.map((x, i) => {
      const k = prog(t, ini + 0.4 + i * Math.min(1.1, ((c.fim - ini) - 0.8) / Math.max(1, itens.length)), 0.35, 'outBack')
      return html`<div key=${i} class=${x.eu ? 'eu' : 'eles'} style=${{ opacity: k, transform: `scale(${0.85 + 0.15 * k})`, transformOrigin: x.eu ? 'right bottom' : 'left bottom' }}>${x.texto}</div>`
    })}</div>`
  } else if (c.tipo === 'cta') {
    const k = spring(t, ini + 0.6, { freq: 1.6, damp: 5 })
    const pulso = 1 + 0.03 * Math.sin(Math.max(0, t - ini - 1.2) * 6)
    corpo = html`<${Titulo} t=${t} txt=${c.titulo} ini=${ini} /><${Texto} t=${t} txt=${c.texto} ini=${ini + 0.4} /><div class="cta" style=${{ transform: `scale(${Math.max(0, k) * pulso})`, opacity: Math.min(1, k * 2), transformOrigin: 'left center' }}>${c.botao || 'Comenta EU QUERO'}</div>`
  } else {
    corpo = html`${c.selo ? html`<div class="selo">${c.selo}</div>` : null}<${Titulo} t=${t} txt=${c.titulo} ini=${ini} /><${Texto} t=${t} txt=${c.texto} ini=${ini + 0.6} />`
  }
  return html`<div class="cena" style=${estilo}>${corpo}</div>`
}
function Legenda({ c, t }) {
  if (!c || !c.palavras || !c.palavras.length) return null
  // mostra a frase em blocos de ~7 palavras: o bloco atual, com a palavra falada agora em destaque
  const bloco = 7
  let atual = c.palavras.findIndex((p, i) => t < (c.palavras[i + 1] ? c.palavras[i + 1].ini : c.falaFim))
  if (atual < 0) atual = c.palavras.length - 1
  const b0 = Math.floor(atual / bloco) * bloco
  const vis = c.palavras.slice(b0, b0 + bloco)
  const a = prog(t, c.ini, 0.25)
  return html`<div class=${"leg" + (TL.legenda === "selecao" ? " selecao" : "")} style=${{ opacity: a * (1 - prog(t, c.fim - 0.2, 0.2)) }}>${vis.map((p, i) => html`<span key=${b0 + i} class=${(t >= p.ini ? 'dita' : '') + (b0 + i === atual ? ' agora' : '')}>${p.w}</span>`)}</div>`
}
function Reel({ t }) {
  const c = TL.cenas.find((x) => t >= x.ini && t < x.fim) || TL.cenas[TL.cenas.length - 1]
  const n = TL.cenas.filter((x) => x.tipo === 'dica' && x.ini <= c.ini).length
  const cx = 30 + 40 * (0.5 + 0.5 * Math.sin(t * 0.21)), cy = 25 + 20 * Math.sin(t * 0.33)
  const fim = prog(t, TL.total - 0.6, 0.6, 'in')
  return html`<div style=${{ position: 'absolute', inset: 0, opacity: 1 - fim }}>
    <div class="fundo" style=${{ '--x': cx + '%', '--y': cy + '%', '--x2': 100 - cx + '%', '--y2': 85 - cy * 0.4 + '%' }}></div>
    <div class="grade" style=${{ transform: `translateY(${-(t * 22) % 90}px)` }}></div>
    ${P.map((p, i) => html`<i class="p" key=${i} style=${{ left: p.x + noise(t * 0.5 + i) * 30 + 'px', top: ((p.y - t * p.v) % 1920 + 1920) % 1920 + 'px', width: p.r + 'px', height: p.r + 'px', opacity: 0.18 + 0.25 * (0.5 + 0.5 * Math.sin(t + i)) }}></i>`)}
    <div class="topo"><i style=${{ transform: `scaleX(${Math.min(1, t / TL.total)})` }}></i></div>
    ${TL.marca ? html`<div class="marca">${TL.marca}</div>` : null}
    ${TL.cenas.filter((x) => t >= x.ini - 0.05 && t < x.fim + 0.05).map((x) => html`<${Cena} key=${x.ini} c=${x} t=${t} n=${n} total=${TL.total} />`)}
    <${Legenda} c=${c} t=${t} />
  </div>`
}

// REVISÃO AUTOMÁTICA (cada quadro): texto saindo da tela, elementos se sobrepondo, coisa na área de botões do Instagram.
// Os avisos aparecem no resultado do motion_previa ("Erros no console da página") para corrigir antes de renderizar.
const __avisos = new Set()
function revisar(t) {
  const caixa = (e) => e.getBoundingClientRect()
  const cena = document.querySelector('.cena')
  const leg = document.querySelector('.leg')
  const avisar = (m) => { if (!__avisos.has(m)) { __avisos.add(m); console.error('REVISAO t=' + t.toFixed(1) + ': ' + m) } }
  if (cena) {
    for (const el of cena.querySelectorAll('.titulo, .texto, .janela, .barras, .comentarios, .chat, .cta, .num, .lista')) {
      const r = caixa(el)
      if (r.width === 0) continue
      if (r.right > 1080 - 40 || r.left < 40) avisar('saiu pela lateral: ' + el.className)
      if (r.bottom > 1920 - 300 && !el.classList.contains('leg')) avisar('entrou na área dos botões do Instagram (embaixo): ' + el.className)
      if (leg && leg.textContent.trim()) { const l = caixa(leg); if (r.bottom > l.top + 8 && r.top < l.bottom && getComputedStyle(cena).opacity > 0.5) avisar('cobre a legenda: ' + el.className) }
    }
    for (const el of cena.querySelectorAll('.titulo span, .texto')) { if (el.scrollWidth > el.clientWidth + 2) avisar('texto cortado: ' + el.textContent.slice(0, 30)) }
  }
}
const root = ReactDOM.createRoot(document.getElementById('raiz'))
// erro de desenho aparece ESCRITO no quadro (a prévia mostra o motivo em vez de um quadro vazio)
window.sbFrame = (t) => { try { ReactDOM.flushSync(() => root.render(html`<${Reel} t=${t} />`)); revisar(t) } catch (e) { document.body.insertAdjacentHTML('beforeend', `<pre style="position:absolute;left:20px;top:20px;right:20px;z-index:99;color:#ff4d4d;background:#000c;font:28px monospace;white-space:pre-wrap">ERRO t=${t.toFixed(2)}: ${String(e && e.stack || e).slice(0, 600)}</pre>`) } }
</script></body></html>
